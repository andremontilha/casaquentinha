<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casa Quentinha">
<meta name="description" content="Divida contas em grupo, veja saldos em tempo real e quite tudo com o menor número de Pix.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Casa Quentinha — contas divididas sem estresse</title>
<style>
/* ============================== TOKENS ============================== */
:root{
  --bg:#efe7d9; --surface:#faf4e8; --surface2:#e9dfcc; --surface3:#f4ecdd;
  --surface-dark:#e2d5bd; --cream:#fdf8ee;
  --ink:#3a332a; --ink-dim:#8a7f6d; --line:#dbcfb6;
  --primary:#e07b3c; --primary-soft:#f7e3ce;
  --green:#2c8c62; --green-soft:#dfeee3;
  --red:#c9524a;  --red-soft:#f4dfd9;
  --blue:#3f7fb8; --blue-soft:#e0eaf2;
  --yellow:#d9a233; --purple:#7d6cba; --pink:#c66f96;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(80,60,35,.07), 0 6px 16px rgba(80,60,35,.07);
  --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:16px; line-height:1.45;
  padding-bottom:88px; overflow-x:hidden;
  touch-action:manipulation; -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:20px} h2{font-size:18px} h3{font-size:15px;margin-bottom:10px}
.small{font-size:14px;color:var(--ink-dim)}
.tiny{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
img,canvas{image-rendering:pixelated}
.tt{font-weight:600}

/* ============================== BLOCOS ============================== */
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px;margin-bottom:14px;position:relative}
.card.flat{box-shadow:none}
.row{display:flex;gap:10px;align-items:center}
.row.wrap2{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:520px){.g3{grid-template-columns:repeat(3,1fr)}}
.sep{height:1px;background:var(--line);margin:14px 0}
.hidden{display:none !important}

/* ============================== BOTÕES ============================== */
button,.btn{
  font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:10px 14px;text-align:center;display:inline-block;
  transition:filter .12s,background .12s;
}
button:hover,.btn:hover{filter:brightness(.97)}
button:active,.btn:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-y{background:var(--primary);color:var(--cream);border-color:var(--primary)}
.btn-g{background:var(--green);color:var(--cream);border-color:var(--green)}
.btn-r{background:var(--red);color:var(--cream);border-color:var(--red)}
.btn-b{background:var(--blue);color:var(--cream);border-color:var(--blue)}
.btn-p{background:var(--surface2);color:var(--ink)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-dim);padding:6px 8px}
.btn-sm{font-size:13px;padding:7px 10px}
.btn-full{display:block;width:100%}
.btn-xl{font-size:16px;padding:14px}

/* ============================== FORM ============================== */
label.f{display:block;margin:14px 0 6px;font-size:12px;font-weight:700;color:var(--ink-dim);
  text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{
  font-family:var(--font);font-size:16px;width:100%;background:var(--surface3);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);background:var(--cream);
  box-shadow:0 0 0 3px var(--primary-soft)}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--primary)}
textarea{min-height:72px;resize:vertical}
input[type=file]{font-size:14px;padding:8px;background:var(--surface3)}

/* ============================== TOPO ============================== */
header.top{position:sticky;top:0;z-index:60;background:rgba(250,244,232,.94);
  backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--line)}
header.top .inner{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.logo span{color:var(--primary)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;cursor:pointer}
.hdr-name{font-size:14px;font-weight:600;color:var(--ink-dim)}

/* ============================== NAV ============================== */
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:70;background:rgba(250,244,232,.97);
  backdrop-filter:saturate(180%) blur(8px);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;background:transparent;border:0;border-radius:0;font-size:11px;font-weight:600;
  color:var(--ink-dim);padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bottom button .ico{font-size:20px;line-height:1.1}
nav.bottom button.on{color:var(--primary)}
nav.bottom button:active{transform:none}

/* ============================== AVATAR ============================== */
.av{display:block}
.av-frame{background:var(--surface2);border:1px solid var(--line);border-radius:12px;
  padding:3px;display:inline-flex;overflow:hidden}
.av-frame.me{border-color:var(--primary);background:var(--primary-soft)}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================== LISTAS ============================== */
.item{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface3)}
.item .grow{flex:1;min-width:0}
.item .ttl{font-size:15px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money{font-size:15px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)} .zero{color:var(--ink-dim)}
.pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface2);
  color:var(--ink);display:inline-block}
.pill.y{background:var(--primary-soft);color:#b45c17}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.r{background:var(--red-soft);color:var(--red)}
.pill.b{background:var(--blue-soft);color:var(--blue)}
.empty{text-align:center;padding:26px 10px;color:var(--ink-dim);font-size:14px}
.empty .big{font-size:38px;line-height:1;margin-bottom:8px}

/* ============================== TABS ============================== */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding:3px;background:var(--surface2);
  border-radius:999px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-size:13px;padding:8px 14px;background:transparent;border:0;border-radius:999px;
  flex:0 0 auto;color:var(--ink-dim)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.modal .tabs{flex-wrap:wrap;overflow:visible}
.modal .tabs button{flex:1 1 44%}

/* ============================== MODAL ============================== */
.modal-bg{position:fixed;inset:0;background:rgba(45,35,20,.5);z-index:200;display:flex;
  align-items:flex-start;justify-content:center;padding:14px;overflow-y:auto}
.modal{background:var(--surface);border-radius:18px;box-shadow:0 20px 50px rgba(40,32,24,.25);
  width:100%;max-width:520px;padding:20px;margin:auto 0}
.modal h2{margin-bottom:4px}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.modal-actions button{flex:1;padding:12px}
.confirm-bg{z-index:400;align-items:center}

/* ============================== TOAST ============================== */
#toasts{position:fixed;left:0;right:0;top:66px;z-index:500;display:flex;flex-direction:column;
  align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--cream);border-radius:999px;font-size:14px;font-weight:600;
  padding:10px 18px;box-shadow:0 8px 20px rgba(40,32,24,.2);animation:pop .2s ease-out, fadeout .4s 2.1s forwards;max-width:90%}
.toast.warn{background:var(--yellow);color:#4a3208}
.toast.bad{background:var(--red);color:var(--cream)}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes fadeout{to{opacity:0;transform:translateY(-10px)}}

/* ============================== MISC ============================== */
.stat{background:var(--surface3);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:12px 8px;text-align:center}
.stat .v{font-size:18px;font-weight:700;display:block;margin-bottom:2px}
.stat .k{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;
  padding:6px 12px;font-size:13px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border:2px solid var(--line);border-radius:9px;cursor:pointer}
.sw.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.member-pick{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto;
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px;background:var(--surface3)}
.member-pick .mp{display:flex;align-items:center;gap:10px;padding:7px 6px;cursor:pointer;border-radius:8px}
.member-pick .mp:hover{background:var(--surface2)}
.member-pick .mp.off{opacity:.4}
.member-pick input[type=number]{width:88px;text-align:right;padding:6px 8px;font-size:15px}
.arrowline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pair{display:inline-flex;flex:0 0 auto}
.pair .av-frame:last-child{margin-left:-10px;box-shadow:-2px 0 0 var(--surface)}
.av-frame.big{padding:6px;border-radius:16px}
.arrowline .ar{font-size:15px;color:var(--ink-dim)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .lbl{width:36%;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:999px}
.bar-row .val{font-size:13px;font-weight:600;width:82px;text-align:right;font-variant-numeric:tabular-nums}
.receipt-thumb{width:54px;height:54px;object-fit:cover;border-radius:8px;cursor:pointer}
.hero{background:linear-gradient(135deg,#f7e8d5,#f6ece2);border:1px solid var(--line)}
.hero-dark{background:linear-gradient(135deg,#ded0b2,#e4d6c4);border:1px solid #cdbfa2}
.hero-dark .av-frame{background:#cdbb99;border-color:#bda986}
.hero-dark input{background:var(--cream);border-color:#cdbfa2}
a{color:var(--blue)}
.warnbar{background:var(--yellow);color:#4a3208;font-size:13px;font-weight:600;padding:9px 14px;text-align:center}
.balbar{display:flex;height:9px;border-radius:999px;overflow:hidden;background:var(--surface2);margin-top:7px}
.balbar i{display:block;height:100%;border-radius:999px}
.note{background:var(--surface3);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;font-size:14px}
</style>
</head>
<body>
<div id="warn" class="warnbar hidden"></div>

<header class="top">
  <div class="inner">
    <div class="logo">Casa <span>Quentinha</span></div>
    <div class="hdr-right" id="hdrProfile">
      <span class="hdr-name" id="hdrName"></span>
      <span class="av-frame me" id="hdrAvatar"></span>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<nav class="bottom">
  <button data-nav="home" class="on"><span class="ico">🏠</span>Início</button>
  <button data-nav="groups"><span class="ico">👥</span>Grupos</button>
  <button data-nav="add"><span class="ico">➕</span>Novo gasto</button>
  <button data-nav="profile"><span class="ico">🙂</span>Perfil</button>
  <button data-nav="menu"><span class="ico">⚙️</span>Ajustes</button>
</nav>

<div id="toasts"></div>
<div id="modalRoot"></div>

<script>
/* =====================================================================
   CASA QUENTINHA — app de divisão de contas (arquivo único, offline)
   ===================================================================== */
"use strict";

/* ---------------------------------------------------------------- util */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = (p='id')=>p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = ()=> new Date().toISOString().slice(0,10);
const cents = v => Math.round((Number(v)||0)*100);
const brl = c => (c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlShort = c => (Math.abs(c)>=100000? 'R$'+(c/100000).toFixed(1).replace('.',',')+'k' : brl(c));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const fmtDate = iso => { const [y,m,d]=iso.split('-'); return `${d}/${m}/${y.slice(2)}`; };

/* ------------------------------------------------------------ storage */
const KEY='casaquentinha_v1';
const OLD_KEY='rachaquest_v1';
let memoryOnly=false, MEM=null;
function loadDB(){
  try{
    const raw = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){
    memoryOnly=true;
    const w=$('#warn'); w.classList.remove('hidden');
    w.textContent='⚠️ Este navegador não guarda dados automaticamente — exporte seu arquivo em Ajustes.';
  }
  return null;
}
var appPronto=false;
function saveDB(interno){
  if(!interno && appPronto) agendaSync();
  if(memoryOnly){ MEM=JSON.stringify(db); return; }
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){
    memoryOnly=true;
    const w=$('#warn'); w.classList.remove('hidden');
    w.textContent='⚠️ Não foi possível salvar (armazenamento cheio). Exporte seus dados em Ajustes.';
    toast('Falha ao salvar. Exporte os dados!','bad');
  }
}

/* --------------------------------------------------------------- SFX */
let audioCtx=null, sfxOn=true;
function beep(freq=440,dur=.08,type='square',vol=.05){
  if(!sfxOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
const sfx={
  click:()=>beep(880,.03,'sine',.03),
  ok:()=>{beep(740,.05,'sine',.04);setTimeout(()=>beep(988,.07,'sine',.04),60)},
  bad:()=>beep(220,.12,'sine',.04)
};

function toast(msg,kind=''){
  const t=document.createElement('div');
  t.className='toast '+kind; t.textContent=msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>t.remove(),2600);
}

/* ================================================================
   AVATAR 16-BIT — desenhado pixel a pixel em canvas
   ================================================================ */
const SKINS   = ['#ffdbac','#f1c27d','#e0ac69','#c68642','#8d5524','#5c3317'];
const HAIRS   = ['#2b1a12','#6b3f1d','#c9922f','#e6c46a','#a04a32','#3b3b5b','#c96a9e','#4fa89c','#ded3c0'];
const CLOTHES = ['#d95f57','#4a7fbf','#3f9e72','#e0a93f','#8b6fc4','#cf7ba0','#3aa8a0','#e07b3c','#efe0c4','#4a4335'];
const HAIRSTYLES = ['curto','longo','moicano','careca','coque','franja'];
const OUTFITS = ['camiseta','regata','capuz','terno','armadura'];


function defaultAvatar(i=0){
  return { body:i%2?'f':'m', skin:SKINS[i%SKINS.length], hair:HAIRS[(i*3)%HAIRS.length],
    style:HAIRSTYLES[i%2?1:0], cloth:CLOTHES[(i*4+2)%CLOTHES.length], outfit:'camiseta',
    acc:'nenhum', eyes:'#3a332a' };
}
function randomAvatar(){
  const r=a=>a[Math.floor(Math.random()*a.length)];
  return { body:Math.random()<.5?'m':'f', skin:r(SKINS), hair:r(HAIRS), style:r(HAIRSTYLES),
    cloth:r(CLOTHES), outfit:r(OUTFITS), acc:'nenhum', eyes:'#3a332a' };
}

/* Grid 16x16. Cada célula: '.'=vazio S=pele H=cabelo C=roupa E=olho O=contorno A=acessório W=branco */
function avatarGrid(a){
  const G = Array.from({length:16},()=>Array(16).fill('.'));
  const set=(x,y,c)=>{ if(x>=0&&x<16&&y>=0&&y<16) G[y][x]=c; };
  const rect=(x1,y1,x2,y2,c)=>{for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)set(x,y,c);};

  // cabeça (linhas 2..8)
  rect(5,2,10,8,'S');
  rect(4,3,4,7,'S'); rect(11,3,11,7,'S');
  // orelhas
  set(3,5,'S'); set(12,5,'S');
  // olhos
  set(6,5,'E'); set(9,5,'E');
  // boca
  set(7,7,'O'); set(8,7,'O');

  // cabelo
  const st=a.style;
  if(st!=='careca'){
    rect(4,1,11,2,'H'); rect(3,2,3,4,'H'); rect(12,2,12,4,'H');
    if(st==='curto'){ rect(4,3,11,3,'H'); }
    if(st==='franja'){ rect(4,3,11,4,'H'); set(6,5,'E'); set(9,5,'E'); }
    if(st==='longo'){ rect(3,2,3,9,'H'); rect(12,2,12,9,'H'); rect(4,3,11,3,'H'); rect(2,4,2,8,'H'); rect(13,4,13,8,'H'); }
    if(st==='moicano'){ rect(0,0,15,0,'.'); rect(4,1,11,2,'.'); rect(6,0,9,3,'H'); rect(3,2,3,4,'.'); rect(12,2,12,4,'.'); }
    if(st==='coque'){ rect(4,3,11,3,'H'); rect(6,0,9,1,'H'); rect(5,1,10,2,'H'); rect(3,2,3,5,'H'); rect(12,2,12,5,'H'); }
  }
  // pescoço
  rect(7,9,8,9,'S');

  // corpo/roupa (10..15)
  const o=a.outfit;
  rect(5,10,10,15,'C');
  rect(4,11,4,14,'C'); rect(11,11,11,14,'C'); // braços
  set(4,15,'S'); set(11,15,'S');              // mãos
  if(o==='regata'){ rect(4,11,4,14,'S'); rect(11,11,11,14,'S'); rect(6,10,9,10,'S'); }
  if(o==='capuz'){ rect(4,9,11,10,'C'); rect(3,10,3,12,'C'); rect(12,10,12,12,'C'); }
  if(o==='terno'){ rect(7,10,8,13,'W'); set(7,11,'O'); set(8,12,'O'); }
  if(o==='armadura'){ rect(4,10,11,11,'A'); rect(7,12,8,13,'A'); }

  return G;
}

function drawAvatar(canvas,a,scale=4){
  const g=avatarGrid(a), ctx=canvas.getContext('2d');
  canvas.width=16*scale; canvas.height=16*scale;
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const map={ S:a.skin, H:a.hair, C:a.cloth, E:a.eyes, O:'#4a3f30', A:'#cbbda2', W:'#f2e8d5' };
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const c=g[y][x]; if(c==='.') continue;
    ctx.fillStyle = map[c]||'#f2e8d5';
    ctx.fillRect(x*scale,y*scale,scale,scale);
  }
}
function avatarHTML(m,scale=3,extraClass=''){
  return `<span class="av-frame ${extraClass}"><canvas class="av" data-av="${m.id}" data-scale="${scale}"></canvas></span>`;
}
function paintAvatars(root=document){
  $$('canvas[data-av]',root).forEach(c=>{
    const m=getMember(c.dataset.av); if(!m) return;
    drawAvatar(c,m.avatar,Number(c.dataset.scale)||3);
  });
}

/* ================================================================
   MODELO DE DADOS
   ================================================================ */
const CATS = [
  {id:'mercado', em:'🛒', nome:'Mercado',   cor:'#2f9e6e'},
  {id:'comida',  em:'🍕', nome:'Comida',    cor:'#ef8b45'},

/* ================================================================
   DIVISÃO — igual / partes / porcentagem / exato
   ================================================================ */
function computeShares(valor, tipo, partes, participantes){
  const out={}; const n=participantes.length;
  if(!n) return out;
  if(tipo==='igual'){
    const base=Math.floor(valor/n); let resto=valor-base*n;
    participantes.forEach((id,i)=>{ out[id]=base+(i<resto?1:0); });
    return out;
  }
  if(tipo==='exato'){
    participantes.forEach(id=> out[id]=Math.round(Number(partes[id])||0));
    return out;
  }
  // porcentagem ou partes (pesos) → proporcional com correção de arredondamento
  const pesos = participantes.map(id=> Math.max(0, Number(partes[id])||0));
  const total = pesos.reduce((a,b)=>a+b,0);
  if(total<=0) return computeShares(valor,'igual',{},participantes);
  let acc=0;
  participantes.forEach((id,i)=>{
    if(i===n-1){ out[id]=valor-acc; }
    else { const v=Math.round(valor*pesos[i]/total); out[id]=v; acc+=v; }
  });
  return out;
}
function shareSum(sh){ return Object.values(sh).reduce((a,b)=>a+b,0); }

/* ================================================================
   SALDOS
   ================================================================ */
function groupBalances(gid){
  const g=getGroup(gid); if(!g) return {};
  const bal={}; g.membros.forEach(id=>bal[id]=0);
  groupExpenses(gid).forEach(e=>{
    if(bal[e.pagoPor]===undefined) bal[e.pagoPor]=0;
    bal[e.pagoPor]+=e.valor;
    Object.entries(e.cotas).forEach(([id,v])=>{ bal[id]=(bal[id]||0)-v; });
  });
  groupSettles(gid).forEach(s=>{
    bal[s.de]=(bal[s.de]||0)+s.valor;
    bal[s.para]=(bal[s.para]||0)-s.valor;
  });
  return bal; // >0 tem a receber, <0 deve
}
function globalBalances(){
  const tot={};
  db.grupos.filter(g=>!g.arquivado).forEach(g=>{
    const b=groupBalances(g.id);
    Object.entries(b).forEach(([id,v])=> tot[id]=(tot[id]||0)+v);
  });
  return tot;
}
/* Simplificação: quita todos os saldos com o menor nº de transferências (guloso) */
function simplify(bal){
  const dev=[], cre=[];
  Object.entries(bal).forEach(([id,v])=>{
    if(v<-0)  dev.push({id,v:-v});
    else if(v>0) cre.push({id,v});
  });
  dev.sort((a,b)=>b.v-a.v); cre.sort((a,b)=>b.v-a.v);
  const res=[]; let i=0,j=0, guard=0;
  while(i<dev.length && j<cre.length && guard++<9999){
    const v=Math.min(dev[i].v, cre[j].v);
    if(v>0) res.push({de:dev[i].id, para:cre[j].id, valor:v});
    dev[i].v-=v; cre[j].v-=v;
    if(dev[i].v<=0) i++;
    if(cre[j].v<=0) j++;
  }
  return res;
}
/* Dívidas "diretas" (sem simplificar): quem deve a quem pelas despesas */
function directDebts(gid){
  const m={};
  groupExpenses(gid).forEach(e=>{
    Object.entries(e.cotas).forEach(([id,v])=>{
      if(id===e.pagoPor||!v) return;
      const k=id+'>'+e.pagoPor, k2=e.pagoPor+'>'+id;
      if(m[k2]!==undefined){ m[k2]-=v; if(m[k2]<0){ m[k]= -m[k2]; delete m[k2]; } }
      else m[k]=(m[k]||0)+v;
    });
  });
  groupSettles(gid).forEach(s=>{
    const k=s.de+'>'+s.para, k2=s.para+'>'+s.de;
    if(m[k]!==undefined){ m[k]-=s.valor; if(m[k]<0){ m[k2]=(m[k2]||0)-m[k]; delete m[k]; } }
    else m[k2]=(m[k2]||0)+s.valor;
  });
  return Object.entries(m).filter(([,v])=>v>0).map(([k,v])=>{
    const [de,para]=k.split('>'); return {de,para,valor:v};
  }).sort((a,b)=>b.valor-a.valor);
}

   AÇÕES (despesas, acertos, recorrentes)
   ================================================================ */
function toca(o){ if(o) o.v=Date.now(); return o; }
function apagado(tipo,id,grupoId){
  db.apagados=db.apagados||{};
  db.apagados[id]={tipo,grupoId,v:Date.now()};
}

function addExpense(d,silent){
  const cotas=computeShares(d.valor,d.tipo,d.partes,d.participantes);
  const e=toca({ id:uid('e'), ...d, cotas, criadoEm:Date.now() });
  db.despesas.push(e);
  if(!silent) saveDB();
  return e;
}
function updateExpense(id,d){
  const i=db.despesas.findIndex(e=>e.id===id); if(i<0) return;
  const cotas=computeShares(d.valor,d.tipo,d.partes,d.participantes);
  db.despesas[i]=toca({...db.despesas[i],...d,cotas}); saveDB();
}
function delExpense(id){
  const e=db.despesas.find(x=>x.id===id);
  if(e) apagado('despesa',id,e.grupoId);
  db.despesas=db.despesas.filter(x=>x.id!==id); saveDB();
}
function addSettle(s){
  db.acertos.push(toca({id:uid('s'),...s,criadoEm:Date.now()}));
  saveDB();
}
/* Materializa despesas recorrentes vencidas */
function runRecurring(){
  const hoje=todayISO(); let criadas=0;
  db.recorrentes.forEach(r=>{
    if(!r.ativo) return; let guard=0;
    while(r.proxima<=hoje && guard++<60){
      addExpense({grupoId:r.grupoId,desc:r.desc,valor:r.valor,categoria:r.categoria,pagoPor:r.pagoPor,
        tipo:r.tipo,partes:r.partes,participantes:r.participantes,data:r.proxima,
        nota:'(recorrente) '+(r.nota||''),recibo:null,recorrenteId:r.id},true);
      criadas++;
      r.proxima = nextDate(r.proxima, r.freq);
    }
  });
  if(criadas){ saveDB(); toast(criadas+' despesa(s) recorrente(s) lançada(s)','warn'); }
}
function nextDate(iso,freq){
  const d=new Date(iso+'T12:00:00');
  if(freq==='semanal') d.setDate(d.getDate()+7);
  else if(freq==='quinzenal') d.setDate(d.getDate()+14);
  else d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}

        <div class="grow" style="flex:1;min-width:0">

function tabRelatorio(g){
  const list=groupExpenses(g.id);
  if(!list.length) return `<div class="card"><div class="empty"><div class="big">📊</div>Sem dados ainda.</div></div>`;
  const tot=list.reduce((a,e)=>a+e.valor,0);
  const porCat={}, porPagador={}, porConsumo={}, porMes={};
  list.forEach(e=>{
    porCat[e.categoria]=(porCat[e.categoria]||0)+e.valor;
    porPagador[e.pagoPor]=(porPagador[e.pagoPor]||0)+e.valor;
    Object.entries(e.cotas).forEach(([id,v])=> porConsumo[id]=(porConsumo[id]||0)+v);
    const mes=e.data.slice(0,7); porMes[mes]=(porMes[mes]||0)+e.valor;
  });
  const bars=(obj,labelFn,colorFn)=>{
    const ent=Object.entries(obj).sort((a,b)=>b[1]-a[1]); const mx=Math.max(...ent.map(e=>e[1]),1);
    return ent.map(([k,v])=>`<div class="bar-row">
      <span class="lbl">${labelFn(k)}</span>
      <span class="bar-track"><i style="width:${v/mx*100}%;background:${colorFn(k)}"></i></span>
      <span class="val">${brlShort(v)}</span></div>`).join('');
  };
  const meses=Object.keys(porMes).sort();
  const mxMes=Math.max(...Object.values(porMes),1);
  const cores=['#ef8b45','#4b8fd4','#2f9e6e','#8b7ad1','#d97ba8','#e9b949'];
  return `
  <div class="grid g2" style="margin-bottom:14px">
    <div class="stat"><span class="v">${brlShort(tot)}</span><span class="k">Total do grupo</span></div>
    <div class="stat"><span class="v">${brlShort(Math.round(tot/g.membros.length))}</span><span class="k">Média por pessoa</span></div>
  </div>
  <div class="card"><h3>Por categoria</h3>
    ${bars(porCat, k=>cat(k).em+' '+cat(k).nome, k=>cat(k).cor)}</div>
  <div class="card"><h3>Quem mais pagou</h3>
    ${bars(porPagador, k=>esc(nameOf(k)), ()=>'var(--green)')}</div>
  <div class="card"><h3>Quem mais consumiu</h3>
    ${bars(porConsumo, k=>esc(nameOf(k)), ()=>'var(--blue)')}</div>
  <div class="card"><h3>Por mês</h3>
    <div style="display:flex;align-items:flex-end;gap:8px;height:130px;padding:8px 4px 0">
      ${meses.map((m,i)=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%">
        <span class="small" style="font-size:11px">${brlShort(porMes[m])}</span>
        <div style="width:100%;max-width:46px;height:${porMes[m]/mxMes*76}%;background:${cores[i%cores.length]};border-radius:8px 8px 0 0"></div>
        <span class="small" style="font-size:11px">${m.slice(5)}/${m.slice(2,4)}</span>
      </div>`).join('')}
    </div></div>`;
}

}

function openModal(html,onMount){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="modal-bg"><div class="modal">${html}</div></div>`;
  const bg=$('.modal-bg',root);
  bg.addEventListener('click',e=>{ if(e.target===bg) closeModal(); });
  paintAvatars(root);
  if(onMount) onMount(root);
  sfx.click();
}
function closeModal(){ $('#modalRoot').innerHTML=''; }

/* Confirmação interna — não depende do confirm() do navegador,
   que é bloqueado em alguns visualizadores/iframes. */
function askConfirm(opts,onYes){
  const {titulo='Tem certeza?',texto='',ok='Apagar',perigo=true}=opts||{};
  const root=document.createElement('div');
  root.className='modal-bg confirm-bg';
  root.innerHTML=`<div class="modal" style="max-width:400px">
    <h2>${esc(titulo)}</h2>
    ${texto?`<div class="small" style="margin-top:8px">${esc(texto)}</div>`:''}
    <div class="modal-actions">
      <button data-no>Cancelar</button>
      <button class="${perigo?'btn-r':'btn-g'}" data-yes>${esc(ok)}</button>
    </div></div>`;
  document.body.appendChild(root);
  const fecha=()=>{ root.remove(); document.removeEventListener('keydown',esckey); };
  const esckey=e=>{ if(e.key==='Escape') fecha(); };
  document.addEventListener('keydown',esckey);
  root.addEventListener('click',e=>{
    e.stopPropagation();
    if(e.target===root || e.target.closest('[data-no]')) return fecha();
    if(e.target.closest('[data-yes]')){ fecha(); sfx.ok(); onYes(); }
  });
  sfx.click();
}

function perguntarIdentidade(g){
  const candidatos=g.membros.map(getMember).filter(m=>m && !m.isMe);
  if(!candidatos.length) return;
  openModal(`
    <h2>Quem é você?</h2>
    <div class="small" style="margin-top:6px;margin-bottom:12px">
      Escolha o seu nome na lista para o app saber quanto <b>você</b> deve ou tem a receber
      em "${esc(ehDupla(g)?nomeDupla(g):g.nome)}".</div>
    <div class="member-pick">${candidatos.map(m=>`
      <div class="mp" data-eusou="${m.id}" style="justify-content:flex-start">
        ${avatarHTML(m,3)}<span style="flex:1">${esc(m.nome)}</span>
        ${m.contato?`<span class="small">${esc(m.contato)}</span>`:''}
      </div>`).join('')}</div>
    <button class="btn-full" id="souOutro" style="margin-top:12px">Não sou nenhum deles</button>`,
  root=>{
    $('#souOutro',root).onclick=()=>{ closeModal(); toast('Você entrou como mais uma pessoa','warn'); render(); };
    $$('[data-eusou]',root).forEach(el=>el.onclick=()=>{
      const novo=getMember(el.dataset.eusou), antigo=me();
      if(!novo||!antigo) return closeModal();
      const antigoEmUso = db.despesas.some(e=>e.pagoPor===antigo.id || (e.cotas||{})[antigo.id]) ||
                          db.acertos.some(a=>a.de===antigo.id||a.para===antigo.id) ||
                          db.grupos.some(x=>x.id!==g.id && x.membros.includes(antigo.id));
      antigo.isMe=false; novo.isMe=true; toca(novo);
      if(!antigoEmUso){
        db.grupos.forEach(x=>{ x.membros=x.membros.filter(id=>id!==antigo.id); });
        db.membros=db.membros.filter(x=>x.id!==antigo.id);
      }
      editingMemberId=null; profileDraft=null;
      saveDB(); closeModal(); render(); sfx.ok();
      toast('Bem-vindo, '+novo.nome);
    });
  });
}

function openExpenseModal(expId){
  if(!db.grupos.filter(g=>!g.arquivado).length){ openGroupModal(); toast('Crie um grupo primeiro','warn'); return; }
  const exp = expId? db.despesas.find(e=>e.id===expId):null;
  const gAtivos=db.grupos.filter(g=>!g.arquivado);
  const gid = exp? exp.grupoId : (ui.groupId && getGroup(ui.groupId) && !getGroup(ui.groupId).arquivado ? ui.groupId : gAtivos[0].id);
  const st = exp? {
      grupoId:exp.grupoId, valor:exp.valor, tipo:exp.tipo, partes:{...exp.partes},
      participantes:[...exp.participantes], pagoPor:exp.pagoPor, categoria:exp.categoria, recibo:exp.recibo
    } : {
      grupoId:gid, valor:0, tipo:'igual', partes:{}, participantes:[...getGroup(gid).membros],
      pagoPor:me().id, categoria:'comida', recibo:null
    };
  if(!getGroup(st.grupoId).membros.includes(st.pagoPor)) st.pagoPor=getGroup(st.grupoId).membros[0];

  openModal(`
    <h2>${exp?'Editar gasto':'Novo gasto'}</h2>
    <label class="f">Grupo</label>
    <select id="exGroup">${gAtivos.map(g=>`<option value="${g.id}" ${g.id===st.grupoId?'selected':''}>${ehDupla(g)?'🤝 '+esc(nomeDupla(g)):g.icone+' '+esc(g.nome)}</option>`).join('')}</select>
    <label class="f">Descrição</label>
    <input id="exDesc" value="${exp?esc(exp.desc):''}" placeholder="Ex: Jantar no bar">
    <div class="row" style="gap:8px">
      <div style="flex:1"><label class="f">Valor (R$)</label>
        <input id="exVal" type="number" inputmode="decimal" step="0.01" min="0" value="${exp?(exp.valor/100).toFixed(2):''}" placeholder="0,00"></div>
      <div style="flex:1"><label class="f">Data</label>
        <input id="exDate" type="date" value="${exp?exp.data:todayISO()}"></div>
    </div>
    <label class="f">Categoria</label>
    <div class="row wrap2" id="exCats">${CATS.map(c=>`<button class="btn-sm ${c.id===st.categoria?'btn-y':''}" data-c="${c.id}">${c.em} ${c.nome}</button>`).join('')}</div>
    <label class="f">Quem pagou</label>
    <select id="exPayer"></select>
    <label class="f">Como dividir</label>
    <div class="tabs" id="exTipo">
      <button data-t="igual">Igual</button><button data-t="partes">Partes</button>
      <button data-t="porcento">Porcentagem</button><button data-t="exato">Valor exato</button>
    </div>
    <div id="exSplit"></div>
    <div id="exStatus" class="small" style="text-align:center;margin-top:10px;font-weight:600"></div>
    <label class="f">Anotação</label>
    <textarea id="exNota" placeholder="Detalhes, quem comeu o quê...">${exp?esc(exp.nota||''):''}</textarea>
    <label class="f">Recibo ou nota fiscal (foto/PDF)</label>
    <input type="file" id="exFile" accept="image/*,application/pdf">
    <div id="exReceipt" style="margin-top:8px"></div>
    <div class="modal-actions">
      <button data-close>Cancelar</button>
      ${exp?`<button class="btn-r" id="exDel">Apagar</button>`:''}
      <button class="btn-g" id="exSave">${exp?'Salvar':'Lançar gasto'}</button>
    </div>`,
  root=>{
    const grp=()=>getGroup(st.grupoId);
    const renderPayer=()=>{
      $('#exPayer',root).innerHTML=grp().membros.map(id=>{const m=getMember(id);
        const marca = m&&m.isMe&&m.nome!=='Você' ? ' (você)' : '';
        return `<option value="${id}" ${id===st.pagoPor?'selected':''}>${esc(m?m.nome:'?')}${marca}</option>`}).join('');
    };
    const renderSplit=()=>{
      $$('#exTipo button',root).forEach(b=>b.classList.toggle('on',b.dataset.t===st.tipo));
      const hint={igual:'Todo mundo marcado divide em partes iguais.',partes:'Use pesos: 2 partes para quem consumiu o dobro.',
        porcento:'A soma precisa dar 100%.',exato:'Informe quanto cada um deve; a soma tem que bater com o total.'}[st.tipo];
      $('#exSplit',root).innerHTML=`<div class="small" style="margin-bottom:8px">${hint}</div>
      <div class="member-pick">${grp().membros.map(id=>{const m=getMember(id); if(!m) return '';
        const on=st.participantes.includes(id);
        const val = st.tipo==='exato'? ((st.partes[id]||0)/100).toFixed(2) : (st.partes[id]??(st.tipo==='porcento'?'':'1'));
        return `<div class="mp ${on?'':'off'}" data-mp="${id}">
          <input type="checkbox" data-chk="${id}" ${on?'checked':''}>
          ${avatarHTML(m,3)}<span style="flex:1">${esc(m.nome)}</span>
          ${st.tipo==='igual'?'':`<input type="number" step="${st.tipo==='exato'?'0.01':'1'}" min="0" data-part="${id}" value="${val}" ${on?'':'disabled'}>`}
          <span class="small" data-prev="${id}" style="min-width:74px;text-align:right"></span>
        </div>`}).join('')}</div>`;
      $$('[data-chk]',root).forEach(c=>c.onchange=()=>{
        const id=c.dataset.chk;
        st.participantes = c.checked ? [...new Set([...st.participantes,id])] : st.participantes.filter(x=>x!==id);
        renderSplit(); sfx.click();
      });
      $$('[data-part]',root).forEach(inp=>inp.oninput=()=>{
        const id=inp.dataset.part;
        st.partes[id]= st.tipo==='exato'? cents(inp.value) : Number(inp.value)||0;
        updatePreview();
      });
      paintAvatars(root); updatePreview();
    };
    const updatePreview=()=>{
      st.valor=cents($('#exVal',root).value);
      const ordered=grp().membros.filter(id=>st.participantes.includes(id));
      const sh=computeShares(st.valor,st.tipo,st.partes,ordered);
      $$('[data-prev]',root).forEach(s=>{
        const v=sh[s.dataset.prev];
        s.textContent = v===undefined?'':brl(v);
      });
      const soma=shareSum(sh), diff=st.valor-soma;
      const el=$('#exStatus',root);
      if(!ordered.length){ el.innerHTML='<span style="color:var(--red)">Selecione quem participou</span>'; return; }
      if(st.tipo==='exato'&&Math.abs(diff)>0){
        el.innerHTML=`<span style="color:var(--red)">Falta ${brl(diff)} para fechar ${brl(st.valor)}</span>`;
      } else if(st.tipo==='porcento'){
        const p=ordered.reduce((a,id)=>a+(Number(st.partes[id])||0),0);
        el.innerHTML= Math.abs(p-100)<0.001? `<span style="color:var(--green)">100% distribuído</span>`
          : `<span style="color:var(--red)">Soma atual: ${p}% (precisa dar 100%)</span>`;
      } else {
        el.innerHTML=`<span style="color:var(--green)">${brl(soma)} divididos entre ${ordered.length} pessoa(s)</span>`;
      }
    };
    const renderReceipt=()=>{
      $('#exReceipt',root).innerHTML = st.recibo?
        `<div class="row"><span class="chip">${st.recibo.tipo==='pdf'?'📄':'🖼️'} ${esc(st.recibo.nome).slice(0,22)}</span>
         <button class="btn-sm btn-r" id="exRmFile">Remover</button></div>`:'';
      const rm=$('#exRmFile',root); if(rm) rm.onclick=()=>{ st.recibo=null; renderReceipt(); };
    };
    renderPayer(); renderSplit(); renderReceipt();
    $('#exGroup',root).onchange=e=>{
      st.grupoId=e.target.value; st.participantes=[...grp().membros];
      if(!grp().membros.includes(st.pagoPor)) st.pagoPor=grp().membros[0];
      st.partes={}; renderPayer(); renderSplit();
    };
    $('#exPayer',root).onchange=e=>st.pagoPor=e.target.value;
    $('#exVal',root).oninput=updatePreview;
    $$('#exCats button',root).forEach(b=>b.onclick=()=>{
      st.categoria=b.dataset.c;
      $$('#exCats button',root).forEach(x=>x.classList.remove('btn-y')); b.classList.add('btn-y'); sfx.click();
    });
    $$('#exTipo button',root).forEach(b=>b.onclick=()=>{
      st.tipo=b.dataset.t;
      const ordered=grp().membros.filter(id=>st.participantes.includes(id));
      if(st.tipo==='partes') ordered.forEach(id=>st.partes[id]=st.partes[id]||1);
      if(st.tipo==='porcento'){ const p=+(100/ordered.length).toFixed(2); ordered.forEach(id=>st.partes[id]=p); }
      if(st.tipo==='exato'){ const eq=computeShares(st.valor,'igual',{},ordered); ordered.forEach(id=>st.partes[id]=eq[id]||0); }
      renderSplit(); sfx.click();
    });
    $('#exFile',root).onchange=async e=>{
      const f=e.target.files[0]; if(!f) return;
      try{ st.recibo=await fileToReceipt(f); renderReceipt(); toast('Recibo anexado'); }
      catch(err){ toast('Arquivo muito grande','bad'); sfx.bad(); }
    };
    const delBtn=$('#exDel',root);
    if(delBtn) delBtn.onclick=()=>askConfirm({titulo:'Apagar este gasto?',texto:esc(exp.desc)+' — '+brl(exp.valor)+'. Os saldos do grupo serão recalculados.'},
      ()=>{ delExpense(exp.id); closeModal(); render(); toast('Gasto apagado','warn'); });
    $('#exSave',root).onclick=()=>{

      ui.groupId=st.grupoId; if(ui.screen!=='group'){ ui.tab='gastos'; go('group',st.grupoId); } else render();

/* ------------------------------------------------ arquivos */
function fileToReceipt(file){
  return new Promise((res,rej)=>{
    if(file.size>8*1024*1024) return rej('big');
    const fr=new FileReader();
    fr.onload=()=>{
      if(file.type==='application/pdf'){ return res({nome:file.name,tipo:'pdf',data:fr.result}); }
      const img=new Image();
      img.onload=()=>{
        const max=900, sc=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res({nome:file.name,tipo:'img',data:cv.toDataURL('image/jpeg',.72)});
      };
      img.onerror=()=>res({nome:file.name,tipo:'pdf',data:fr.result});
      img.src=fr.result;
    };
    fr.onerror=rej;
    fr.readAsDataURL(file);
  });
}

/* ================================================================
   SINCRONIZAÇÃO NA NUVEM (Supabase)
   O app continua funcionando 100% offline; a nuvem é opcional e
   ligada grupo a grupo. Conflitos: vence a alteração mais recente.
   ================================================================ */
var sync = { estado:'parado', msg:'', ultima:0, rodando:false, agendado:null };

function nuvemPronta(){ return !!(db.nuvem && db.nuvem.url && db.nuvem.chave); }
function gruposNaNuvem(){ return db.grupos.filter(g=>g.nuvem && g.nuvem.segredo); }

async function rpc(fn,args){
  if(!nuvemPronta()) throw new Error('Sincronização não configurada');
  const base=db.nuvem.url.trim().replace(/\/+$/,'');
  const chave=db.nuvem.chave.trim();
  const headers={'Content-Type':'application/json','apikey':chave};
  // chave antiga (anon, formato JWT) vai também no Authorization; a nova (sb_publishable_) não precisa
  if(chave.startsWith('eyJ')) headers['Authorization']='Bearer '+chave;
  const r=await fetch(base+'/rest/v1/rpc/'+fn,{method:'POST',headers,body:JSON.stringify(args)});
  const txt=await r.text();
  if(!r.ok) throw new Error('('+r.status+') '+txt.slice(0,160));
  return txt? JSON.parse(txt) : null;
}

function limpaItem(tipo,obj){
  const c={...obj};
  if(tipo==='grupo') delete c.nuvem;
  if(tipo==='membro') delete c.isMe;
  return c;
}
function itensDoGrupo(g,desde){
  const out=[];
  const add=(tipo,o)=>{ if((o.v||0)>desde) out.push({item_id:o.id,tipo,dados:limpaItem(tipo,o),apagado:false,versao:o.v||0}); };
  add('grupo',g);
  g.membros.map(getMember).filter(Boolean).forEach(m=>add('membro',m));
  db.despesas.filter(e=>e.grupoId===g.id).forEach(e=>add('despesa',e));
  db.acertos.filter(a=>a.grupoId===g.id).forEach(a=>add('acerto',a));
  Object.entries(db.apagados||{}).forEach(([id,t])=>{
    if(t.grupoId===g.id && (t.v||0)>desde) out.push({item_id:id,tipo:t.tipo,dados:{},apagado:true,versao:t.v});
  });
  return out;
}

function aplicaRemoto(g,linhas){
  let mudou=0;
  linhas.forEach(l=>{
    const id=l.item_id, ver=Number(l.versao)||0, d=l.dados||{};
    const morto=(db.apagados||{})[id];
    if(morto && (morto.v||0)>=ver) return;               // apagamos aqui depois: mantém apagado
    if(l.apagado){
      if(l.tipo==='despesa' && db.despesas.some(e=>e.id===id)){ db.despesas=db.despesas.filter(e=>e.id!==id); mudou++; }
      if(l.tipo==='acerto'  && db.acertos.some(a=>a.id===id)){ db.acertos=db.acertos.filter(a=>a.id!==id); mudou++; }
      if(l.tipo==='grupo'   && getGroup(id)){
        db.grupos=db.grupos.filter(x=>x.id!==id);
        db.despesas=db.despesas.filter(e=>e.grupoId!==id);
        db.acertos=db.acertos.filter(a=>a.grupoId!==id);
        mudou++;
      }
      db.apagados[id]={tipo:l.tipo,grupoId:g.id,v:ver};
      return;
    }
    if(l.tipo==='grupo'){
      const loc=getGroup(id);
      if(!loc){ db.grupos.push({...d,v:ver,nuvem:{...g.nuvem}}); mudou++; }
      else if((loc.v||0)<ver){ const nu=loc.nuvem; Object.assign(loc,d,{v:ver,nuvem:nu}); mudou++; }
    }
    else if(l.tipo==='membro'){
      const loc=getMember(id);
      if(!loc){ db.membros.push({...d,v:ver,isMe:false}); mudou++; }
      else if((loc.v||0)<ver){ const eu=loc.isMe; Object.assign(loc,d,{v:ver,isMe:eu}); mudou++; }
    }
    else if(l.tipo==='despesa'){
      const i=db.despesas.findIndex(e=>e.id===id);
      if(i<0){ db.despesas.push({...d,v:ver}); mudou++; }
      else if((db.despesas[i].v||0)<ver){ db.despesas[i]={...d,v:ver}; mudou++; }
    }
    else if(l.tipo==='acerto'){
      const i=db.acertos.findIndex(a=>a.id===id);
      if(i<0){ db.acertos.push({...d,v:ver}); mudou++; }
      else if((db.acertos[i].v||0)<ver){ db.acertos[i]={...d,v:ver}; mudou++; }
    }
  });
  return mudou;
}

async function sincronizar(manual){
  if(sync.rodando || !nuvemPronta()) return;
  const gs=gruposNaNuvem();
  if(!gs.length){ if(manual) toast('Nenhum grupo com sincronização ligada','warn'); return; }
  sync.rodando=true; sync.estado='sincronizando'; pintaSync();
  let mudou=0;
  try{
    for(const g of gs){
      const desde=g.nuvem.enviadoAte||0;
      const itens=itensDoGrupo(g,desde);
      if(itens.length){
        await rpc('cq_push',{p_grupo:g.nuvem.id,p_segredo:g.nuvem.segredo,p_itens:itens});
        g.nuvem.enviadoAte=Math.max(desde,...itens.map(i=>i.versao));
      }
      const linhas=await rpc('cq_pull',{p_grupo:g.nuvem.id,p_segredo:g.nuvem.segredo,
        p_desde:g.nuvem.cursor||'1970-01-01T00:00:00Z'});
      if(Array.isArray(linhas) && linhas.length){
        mudou+=aplicaRemoto(g,linhas);
        g.nuvem.cursor=linhas.map(l=>l.atualizado_em).sort().pop();
      }
    }
    sync.estado='ok'; sync.msg=''; sync.ultima=Date.now();
    saveDB(true);
    if(mudou){ render(); toast(mudou+' novidade(s) do grupo'); }
    else if(manual) toast('Tudo sincronizado');
  }catch(e){
    sync.estado='erro'; sync.msg=String(e.message||e);
    if(manual){ toast('Não deu para sincronizar','bad'); sfx.bad(); }
  }
  sync.rodando=false; pintaSync();
  if(ui.screen==='menu'||ui.screen==='group') render();
}

function agendaSync(){
  if(!appPronto || !nuvemPronta() || !gruposNaNuvem().length) return;
  clearTimeout(sync.agendado);
  sync.agendado=setTimeout(()=>sincronizar(false),2500);
}
function pintaSync(){
  $$('[data-sync-status]').forEach(el=>{ el.textContent=textoSync(); el.className='small '+(sync.estado==='erro'?'neg':sync.estado==='ok'?'pos':''); });
}
function textoSync(){
  if(!nuvemPronta()) return 'Não configurada.';
  if(!gruposNaNuvem().length) return 'Conectada. Nenhum grupo sincronizando ainda.';
  if(sync.estado==='sincronizando') return 'Sincronizando…';
  if(sync.estado==='erro') return 'Erro: '+sync.msg;
  if(sync.ultima) return 'Tudo em dia (última sincronização às '+new Date(sync.ultima).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+').';
  return 'Conectada.';
}

/* liga a nuvem em um grupo específico */
async function ligarNuvem(g){
  if(!nuvemPronta()){ toast('Configure a sincronização em Ajustes','warn'); go('menu'); return; }
  if(precisaNome()) return pedirNome(()=>ligarNuvem(g));
  const segredo = g.nuvem&&g.nuvem.segredo ? g.nuvem.segredo : uid('s')+uid('k');
  try{
    await rpc('cq_registrar',{p_grupo:g.id,p_segredo:segredo});
    g.nuvem={id:g.id,segredo,enviadoAte:0,cursor:null};
    toca(g); saveDB(true);
    await sincronizar(true);
    render(); toast('Grupo na nuvem');
  }catch(e){ toast('Falha: '+String(e.message||e).slice(0,60),'bad'); sfx.bad(); }
}
function desligarNuvem(g){ delete g.nuvem; saveDB(true); render(); toast('Sincronização desligada deste grupo','warn'); }

  if(d.gicon){ const g=getGroup(ui.groupId); if(g){ g.icone=d.gicon; toca(g); saveDB(); render(); sfx.click(); } return; }
  if(d.rmMember){
    const g=getGroup(ui.groupId); if(!g) return;
    const bal=groupBalances(g.id)[d.rmMember]||0;
    if(Math.abs(bal)>0){ toast('Acerte o saldo antes de remover','bad'); sfx.bad(); return; }
    if(groupExpenses(g.id).some(e=>e.pagoPor===d.rmMember||e.cotas[d.rmMember])){ toast('Participante tem gastos no grupo','bad'); sfx.bad(); return; }
    g.membros=g.membros.filter(x=>x!==d.rmMember); toca(g); saveDB(); render(); return;
  }
  if(d.delMember){
    if(db.grupos.some(g=>g.membros.includes(d.delMember))){ toast('Remova dos grupos primeiro','bad'); sfx.bad(); return; }
    askConfirm({titulo:'Apagar '+nameOf(d.delMember)+'?'},
      ()=>{ db.membros=db.membros.filter(m=>m.id!==d.delMember); saveDB(); render(); toast('Pessoa apagada','warn'); });
    return;
  }
  if(d.duplaAbrir){ abrirDupla(d.duplaAbrir); return; }
  if(d.editMember){ editingMemberId=d.editMember; profileDraft=null; go('profile'); return; }
  if(d.avSet){
    const [k,v]=d.avSet.split(':');
    if(profileDraft){ profileDraft.avatar[k]=v; render(); sfx.click(); }
    return;
  }

  switch(d.act){
    case 'back': ui.groupId=null; go('groups'); break;
    case 'new-exp': openExpenseModal(); break;
    case 'new-group': openGroupModal(); break;
    case 'nova-dupla': openDuplaModal(); break;
    case 'new-member': openMemberModal(); break;
    case 'manual-settle': openSettleModal(); break;
    case 'new-rec': openRecModal(); break;
    case 'invite': openInviteModal(); break;
    case 'rand-av': if(profileDraft){ profileDraft.avatar=randomAvatar(); render(); sfx.click(); } break;
    case 'save-profile': {
      const m=getMember(editingMemberId); if(!m) break;
      const nome=$('#pName').value.trim(); if(nome) m.nome=nome;
      m.contato=$('#pContato').value.trim();
      m.avatar={...profileDraft.avatar};
      toca(m); saveDB(); render(); sfx.ok(); toast('Perfil salvo');
      break;
    }
    case 'save-group': {
      const g=getGroup(ui.groupId); if(!g) break;
      const n=$('#gName').value.trim(); if(n) g.nome=n;
      toca(g); saveDB(); render(); sfx.ok(); toast('Grupo atualizado');
      break;
    }
    case 'add-existing': {
      const g=getGroup(ui.groupId); if(!g) break;
      const fora=db.membros.filter(m=>!g.membros.includes(m.id));
      openModal(`<h2>Adicionar ao grupo</h2>
        <div class="member-pick">${fora.map(m=>`<label class="mp"><input type="checkbox" value="${m.id}">
          ${avatarHTML(m,3)}<span>${esc(m.nome)}</span></label>`).join('')}</div>
        <div class="modal-actions"><button data-close>Cancelar</button><button class="btn-g" id="aeSave">Adicionar</button></div>`,
        root=>{ $('#aeSave',root).onclick=()=>{
          $$('.member-pick input:checked',root).forEach(i=>{ if(!g.membros.includes(i.value)) g.membros.push(i.value); });
          toca(g); saveDB(); closeModal(); render(); sfx.ok(); };
        });
      break;
    }
    case 'archive': { const g=getGroup(ui.groupId); if(!g) break; g.arquivado=!g.arquivado; saveDB(); render(); break; }
    case 'del-group': {
      const g=getGroup(ui.groupId); if(!g) break;
      askConfirm({titulo:'Apagar "'+g.nome+'"?',texto:'Todos os gastos, acertos e recorrentes deste grupo serão apagados.'},()=>{
        apagado('grupo',g.id,g.id);
        db.despesas.filter(e=>e.grupoId===g.id).forEach(e=>apagado('despesa',e.id,g.id));
        db.acertos.filter(a=>a.grupoId===g.id).forEach(a=>apagado('acerto',a.id,g.id));
        db.grupos=db.grupos.filter(x=>x.id!==g.id);
        db.despesas=db.despesas.filter(e=>e.grupoId!==g.id);
        db.acertos=db.acertos.filter(s=>s.grupoId!==g.id);
        db.recorrentes=db.recorrentes.filter(r=>r.grupoId!==g.id);
        saveDB(); ui.groupId=null; go('groups'); toast('Grupo apagado','warn');
      });
      break;
    }
    case 'save-nuvem': {
      db.nuvem.url=$('#cfgUrl').value.trim();
      db.nuvem.chave=$('#cfgChave').value.trim();
      saveDB(true); render();
      if(nuvemPronta()){ toast('Conexão salva'); sincronizar(true); } else toast('Preencha endereço e chave','warn');
      break;
    }
    case 'sync-now': sincronizar(true); break;
    case 'entrar-convite': {
      const bruto=($('#cvCodigo').value||'').trim();
      const cod = bruto.includes('#convite=') ? bruto.split('#convite=')[1].trim() : bruto;
      if(!cod){ toast('Cole o link do convite','bad'); sfx.bad(); break; }
      importInvite(cod);
      break;
    }
    case 'nuvem-on': { const g=getGroup(ui.groupId); if(g) ligarNuvem(g); break; }
    case 'nuvem-off': { const g=getGroup(ui.groupId); if(g) desligarNuvem(g); break; }
    case 'install':
      if(promptInstalar){
        promptInstalar.prompt();
        promptInstalar.userChoice.then(r=>{
          if(r.outcome==='accepted') toast('Instalando…');
          promptInstalar=null; render();
        });
      }
      break;
    case 'export': exportJSON(); break;
    case 'import': $('#fileImport').click(); break;
    case 'toggle-sfx': sfxOn=!sfxOn; db.config.sfx=sfxOn; saveDB(); render(); if(sfxOn) sfx.ok(); break;
    case 'reset':
      askConfirm({titulo:'Apagar tudo?',texto:'Grupos, gastos, acertos e pessoas deste aparelho. Exporte antes se quiser guardar.',ok:'Apagar tudo'},()=>{
        db=freshDB(); saveDB(); editingMemberId=null; profileDraft=null; ui={screen:'home',groupId:null,tab:'gastos'};
        go('home'); toast('Tudo apagado','warn');
      });
      break;
  }
});

document.addEventListener('change',ev=>{
  if(ev.target.id==='fileImport'){
    const f=ev.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const novo=JSON.parse(fr.result);
        if(!novo.membros||!novo.grupos) throw 0;
        askConfirm({titulo:'Substituir os dados atuais?',texto:'O conteúdo deste aparelho será trocado pelo arquivo importado.',ok:'Substituir'},()=>{
          db=novo;
          db.recorrentes=db.recorrentes||[]; db.config=db.config||{sfx:true};
          db.nuvem=db.nuvem||{url:'',chave:''}; db.apagados=db.apagados||{};
          if(!db.membros.some(m=>m.isMe)) db.membros[0].isMe=true;
          saveDB(); editingMemberId=null; profileDraft=null; go('home'); toast('Dados importados'); sfx.ok();
        });
      }catch(e){ toast('Arquivo inválido','bad'); sfx.bad(); }
    };
    fr.readAsText(f);
    ev.target.value='';
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ================================================================
   BOOT
   ================================================================ */
/* PWA: instalação e funcionamento offline (só quando publicado em http/https) */
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); promptInstalar=e; if(ui.screen==='menu') render(); });
window.addEventListener('appinstalled',()=>{ promptInstalar=null; toast('App instalado'); if(ui.screen==='menu') render(); });
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

appPronto=true;
runRecurring();
render();
if(nuvemPronta()) setTimeout(()=>sincronizar(false),800);
setInterval(()=>{ if(document.visibilityState==='visible') sincronizar(false); },45000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') sincronizar(false); });
window.addEventListener('online',()=>sincronizar(false));
if(location.hash.startsWith('#convite=')){
  const code=location.hash.slice(9);
  history.replaceState(null,'',location.pathname);
  setTimeout(()=>askConfirm({titulo:'Convite recebido',texto:'Quer adicionar este grupo ao seu aparelho?',ok:'Importar',perigo:false},
    ()=>importInvite(code)),400);
}

</script>
</body>
</html>
